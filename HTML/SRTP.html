<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D熵增可视化 - 粒子扩散模型</title>
    <style>
        body { margin: 0; background: #000; }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #42b983;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .speed-control { color: #fff; font-size: 14px; }
    </style>
    <!-- 本地引入three.min.js（确保文件在同目录） -->
    <script src="./three.min.js"></script>
</head>
<body>
    <div class="controls">
        <button id="resetBtn">重置初始有序状态</button>
        <div class="speed-control">
            运动速度：<input type="range" id="speedSlider" min="0.001" max="0.05" step="0.001" value="0.01">
        </div>
    </div>

    <script>
        window.onload = function() {
            // 1. 基础3D环境
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. 封闭容器（白色线框+半透明实体）
            const containerGeo = new THREE.BoxGeometry(10,10,10);
            // 实体容器
            const containerMat = new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.2 });
            const container = new THREE.Mesh(containerGeo, containerMat);
            scene.add(container);
            // 线框容器（更显眼）
            const wireframe = new THREE.LineSegments(
                new THREE.EdgesGeometry(containerGeo),
                new THREE.LineBasicMaterial({ color: 0xffffff })
            );
            scene.add(wireframe);

            // 3. 生成有序粒子（红色小球，125个）
            const particles = [];
            const particleGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const particleMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

            let count = 0;
            for (let x = -4; x <= 4; x += 2) {
                for (let y = -4; y <= 4; y += 2) {
                    for (let z = -4; z <= 4; z += 2) {
                        const p = new THREE.Mesh(particleGeo, particleMat.clone());
                        p.position.set(x, y, z);
                        scene.add(p);
                        particles.push(p);
                        count++;
                    }
                }
            }
            console.log("粒子数量：", count); // 确认粒子生成

            // 4. 固定相机位置（无需OrbitControls，先看得到粒子）
            camera.position.set(10, 8, 15); // 斜视角，能看到整个容器
            camera.lookAt(0, 0, 0); // 相机朝向容器中心

            // 手动视角控制（替代OrbitControls）
let isDragging = false;
let lastX = 0, lastY = 0;
let cameraAngleX = 0, cameraAngleY = 0;

// 鼠标拖拽旋转视角
document.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
});
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - lastX;
    const deltaY = e.clientY - lastY;
    cameraAngleY += deltaX * 0.01;
    cameraAngleX = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraAngleX - deltaY * 0.01));
    // 更新相机位置（球面坐标转笛卡尔坐标）
    const radius = 15; // 相机到中心的距离
    camera.position.x = radius * Math.cos(cameraAngleX) * Math.sin(cameraAngleY);
    camera.position.y = radius * Math.sin(cameraAngleX);
    camera.position.z = radius * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
    camera.lookAt(0, 0, 0);
    lastX = e.clientX;
    lastY = e.clientY;
});
document.addEventListener('mouseup', () => isDragging = false);

// 滚轮缩放视角
document.addEventListener('wheel', (e) => {
    const scale = e.deltaY > 0 ? 0.95 : 1.05;
    camera.position.multiplyScalar(scale);
    camera.position.clampLength(5, 30); // 限制缩放范围
    camera.lookAt(0, 0, 0);
});

            // 5. 交互逻辑（重置+速度调节）
            let speed = 0.01;
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');

            speedSlider.oninput = (e) => speed = parseFloat(e.target.value);
            resetBtn.onclick = () => {
                let idx = 0;
                for (let x = -4; x <= 4; x += 2) {
                    for (let y = -4; y <= 4; y += 2) {
                        for (let z = -4; z <= 4; z += 2) {
                            particles[idx] && particles[idx].position.set(x, y, z);
                            idx++;
                        }
                    }
                }
            };

            // 6. 动画循环（粒子扩散）
            function animate() {
                requestAnimationFrame(animate);
                particles.forEach(p => {
                    p.position.x += (Math.random()-0.5)*speed;
                    p.position.y += (Math.random()-0.5)*speed;
                    p.position.z += (Math.random()-0.5)*speed;
                    p.position.clampScalar(-5, 5); // 限制在容器内
                });
                renderer.render(scene, camera);
            }
            animate();
            console.log("3D场景已显示！");
        };
    </script>
</body>
</html>
