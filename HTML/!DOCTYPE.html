<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Mok Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #video-input { position: absolute; top: 10px; left: 10px; width: 160px; height: 120px; z-index: 2; opacity: 0.5; transform: scaleX(-1); border: 1px solid #00ffff; border-radius: 8px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffff; font-size: 24px; z-index: 10; pointer-events: none; text-shadow: 0 0 10px #00ffff; }
        #hud { position: absolute; bottom: 20px; left: 20px; color: #fff; z-index: 5; font-size: 14px; pointer-events: none; text-shadow: 0 0 5px #000; }
        .hud-item { margin-bottom: 5px; opacity: 0.7; transition: opacity 0.3s, color 0.3s; }
        .active { opacity: 1; color: #00ffff; font-weight: bold; text-shadow: 0 0 8px #00ffff; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/hands": "https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js",
                "@mediapipe/camera_utils": "https://unpkg.com/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
            }
        }
    </script>
</head>
<body>

    <div id="loading">正在初始化量子场... (请允许摄像头)</div>
    <video id="video-input" playsinline></video>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div id="state-open" class="hud-item">🖐 张手：聚能球体</div>
        <div id="state-scissor" class="hud-item">✌ 剪刀：我是 Mok</div>
        <div id="state-fist" class="hud-item">✊ 握拳：引力圆环</div>
        <div id="state-point" class="hud-item">☝ 食指：星辰形态</div>
        <div id="state-thumb" class="hud-item">👍 拇指：爱心力场</div>
        <br>
        <div class="hud-item">⚡ 快速挥手：风暴吹散</div>
        <div class="hud-item">↔ 手掌远近：空间缩放</div>
    </div>

    <script src="https://unpkg.com/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/control_utils@0.6.1675466023/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- 配置 ---
        const PARTICLE_COUNT = 16000;
        const PARTICLE_SIZE = 0.6; // 稍微调大一点，视觉更饱满
        const COLOR_CYAN = 0x00ffff;
        
        // 物理参数
        const SPRING_STRENGTH = 0.05; // 目标吸引力
        const DAMPING = 0.92;         // 阻尼 (空气摩擦)
        const EXPLOSION_FORCE = 2.0;  // 切换形状时的爆炸力度
        const WIND_SENSITIVITY = 0.08;// 挥手灵敏度
        
        // --- 状态管理 ---
        let currentShape = 'sphere'; // sphere, text, torus, star, heart
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        
        // --- Three.js 初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 添加一点微弱的背景雾，增加深度感
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 粒子系统构建 ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = new Float32Array(PARTICLE_COUNT * 3);
        
        // 初始化位置（随机分布）
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 100;
            velocities[i] = 0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // 创建发光纹理
        const getTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(0,255,255,1)');
            gradient.addColorStop(0.5, 'rgba(0,50,50,0.5)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        };

        const material = new THREE.PointsMaterial({
            color: COLOR_CYAN,
            size: PARTICLE_SIZE,
            map: getTexture(),
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 形状生成器 ---
        
        function generateSphere() {
            const arr = new Float32Array(PARTICLE_COUNT * 3);
            const radius = 12;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                arr[i*3] = radius * Math.cos(theta) * Math.sin(phi);
                arr[i*3+1] = radius * Math.sin(theta) * Math.sin(phi);
                arr[i*3+2] = radius * Math.cos(phi);
            }
            return arr;
        }

        function generateTorus() {
            const arr = new Float32Array(PARTICLE_COUNT * 3);
            const R = 10; // 大半径
            const r = 4;  // 小半径
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 2;
                arr[i*3] = (R + r * Math.cos(v)) * Math.cos(u);
                arr[i*3+1] = (R + r * Math.cos(v)) * Math.sin(u);
                arr[i*3+2] = r * Math.sin(v);
            }
            return arr;
        }

        function generateHeart() {
            const arr = new Float32Array(PARTICLE_COUNT * 3);
            const scale = 0.8;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Heart curve: (x^2+y^2-1)^3 - x^2*y^3 = 0
                // Parametric approximation via rejection sampling or distribution
                let x, y, z;
                let valid = false;
                while(!valid) {
                    x = (Math.random() - 0.5) * 4;
                    y = (Math.random() - 0.5) * 4;
                    z = (Math.random() - 0.5) * 2; // Thickness
                    const a = x*x + y*y - 1;
                    if (a*a*a - x*x*y*y*y <= 0) valid = true;
                }
                // Flip Y to make it upright
                arr[i*3] = x * 10 * scale;
                arr[i*3+1] = y * 10 * scale;
                arr[i*3+2] = z * 5 * scale;
            }
            return arr;
        }

        function generateStar() {
            const arr = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                // 简单的五角星极坐标逻辑
                const u = 5 * angle;
                const rBase = 8 + 6 * Math.cos(u); // 波动半径
                const r = rBase * Math.sqrt(Math.random()); // 内部填充
                
                arr[i*3] = r * Math.cos(angle);
                arr[i*3+1] = r * Math.sin(angle);
                arr[i*3+2] = (Math.random() - 0.5) * 2; // Flat 3D
            }
            return arr;
        }

        function generateTextCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0,0,200,100);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('我是 Mok', 100, 50);
            
            const imageData = ctx.getImageData(0, 0, 200, 100);
            const pixels = [];
            for(let y=0; y<100; y+=1) { // 采样步长1
                for(let x=0; x<200; x+=1) {
                    const alpha = imageData.data[(y*200+x)*4]; // 只看红色通道(黑白)
                    if(alpha > 128) {
                        pixels.push({x: (x - 100) * 0.25, y: -(y - 50) * 0.25});
                    }
                }
            }
            
            const arr = new Float32Array(PARTICLE_COUNT * 3);
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const p = pixels[i % pixels.length]; // 循环使用像素点
                // 增加一点随机抖动让字看起来有体积感
                arr[i*3] = p.x * 3 + (Math.random()-0.5)*0.5;
                arr[i*3+1] = p.y * 3 + (Math.random()-0.5)*0.5;
                arr[i*3+2] = (Math.random() - 0.5) * 3; 
            }
            return arr;
        }

        // 预生成所有形状
        const shapes = {
            sphere: generateSphere(),
            torus: generateTorus(),
            heart: generateHeart(),
            star: generateStar(),
            text: generateTextCanvas()
        };
        
        // 初始目标
        targetPositions.set(shapes.sphere);

        function triggerExplosion() {
            for(let i=0; i<PARTICLE_COUNT; i++) {
                velocities[i*3] += (Math.random()-0.5) * EXPLOSION_FORCE * 10;
                velocities[i*3+1] += (Math.random()-0.5) * EXPLOSION_FORCE * 10;
                velocities[i*3+2] += (Math.random()-0.5) * EXPLOSION_FORCE * 10;
            }
        }

        function switchShape(newShape) {
            if (currentShape === newShape) return;
            currentShape = newShape;
            targetPositions.set(shapes[newShape]);
            triggerExplosion(); // 切换时爆炸特效
            
            // 更新 UI 高亮
            document.querySelectorAll('.hud-item').forEach(el => el.classList.remove('active'));
            let id = '';
            if(newShape === 'sphere') id = 'state-open';
            if(newShape === 'text') id = 'state-scissor';
            if(newShape === 'torus') id = 'state-fist';
            if(newShape === 'star') id = 'state-point';
            if(newShape === 'heart') id = 'state-thumb';
            if(id) document.getElementById(id).classList.add('active');
        }

        // --- MediaPipe 逻辑 ---
        
        let handPos = { x: 0, y: 0, z: 0 };
        let handVelocity = { x: 0, y: 0 };
        let lastHandPos = { x: 0, y: 0, time: 0 };
        let handPresent = false;
        let handDepthScale = 1.0;

        const videoElement = document.getElementById('video-input');

        function onResults(results) {
            document.getElementById('loading').style.display = 'none';
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handPresent = true;
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. 计算手掌中心 (Landmark 0, 5, 9, 13, 17 的平均值)
                let cx = 0, cy = 0;
                [0,5,9,13,17].forEach(idx => { cx += landmarks[idx].x; cy += landmarks[idx].y; });
                cx /= 5; cy /= 5;

                // 映射到 Three.js 坐标 (-1 to 1) -> world space
                // 注意 MediaPipe x 是 0(左) - 1(右), 但视频被镜像了，所以逻辑要反一下
                const worldX = (0.5 - cx) * 50; 
                const worldY = (0.5 - cy) * 30;
                
                // 2. 计算速度 (用于风暴交互)
                const now = performance.now();
                const dt = now - lastHandPos.time;
                if (dt > 0) {
                    const vx = (worldX - lastHandPos.x) / dt;
                    const vy = (worldY - lastHandPos.y) / dt;
                    // 平滑速度
                    handVelocity.x = handVelocity.x * 0.8 + vx * 0.2;
                    handVelocity.y = handVelocity.y * 0.8 + vy * 0.2;
                }
                lastHandPos = { x: worldX, y: worldY, time: now };
                handPos.x = worldX;
                handPos.y = worldY;

                // 3. 深度推拉 (基于手掌边框面积)
                // 简单估算：手腕(0)到中指根(9)的距离
                const dx = landmarks[0].x - landmarks[9].x;
                const dy = landmarks[0].y - landmarks[9].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                // 距离越大，手越近，画面占比越大
                // 基准距离约 0.3
                const targetScale = 0.5 + dist * 2.0; 
                handDepthScale = handDepthScale * 0.9 + targetScale * 0.1;

                // 4. 手势识别
                detectGesture(landmarks);

            } else {
                handPresent = false;
                handVelocity = { x: 0, y: 0 };
            }
        }

        function detectGesture(lm) {
            // 简单的手指状态检测
            // 拇指：比较 x 坐标 (简化)
            const isThumbOpen = Math.abs(lm[4].x - lm[2].x) > 0.05; // 相对粗略
            
            // 其他手指：比较指尖(TIP)和指关节(PIP)的Y坐标
            const isIndexOpen = lm[8].y < lm[6].y;
            const isMiddleOpen = lm[12].y < lm[10].y;
            const isRingOpen = lm[16].y < lm[14].y;
            const isPinkyOpen = lm[20].y < lm[18].y;

            let openCount = 0;
            if(isIndexOpen) openCount++;
            if(isMiddleOpen) openCount++;
            if(isRingOpen) openCount++;
            if(isPinkyOpen) openCount++;

            // 逻辑判定
            if (openCount === 4 && isThumbOpen) {
                switchShape('sphere'); // 张手
            } else if (openCount === 0 && !isThumbOpen) {
                switchShape('torus'); // 握拳
            } else if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                switchShape('text'); // 剪刀手
            } else if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                switchShape('star'); // 食指
            } else if (isThumbOpen && !isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                switchShape('heart'); // 竖大拇指 (注：MP的拇指检测在某些角度可能需要优化，这里做简化处理)
            }
            // 修正：爱心通常需要特定手势，这里映射给"竖大拇指"以便交互
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://unpkg.com/@mediapipe/hands@0.4.1675469240/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // --- 物理与渲染循环 ---

        // 用于风暴交互的计算
        const stormVector = new THREE.Vector3();
        
        function animate() {
            requestAnimationFrame(animate);

            const positionsArr = geometry.attributes.position.array;
            
            // 计算挥手速度大小
            const handSpeed = Math.sqrt(handVelocity.x**2 + handVelocity.y**2);
            const isStorming = handSpeed > WIND_SENSITIVITY;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const px = positionsArr[i*3];
                const py = positionsArr[i*3+1];
                const pz = positionsArr[i*3+2];

                const tx = targetPositions[i*3];
                const ty = targetPositions[i*3+1];
                const tz = targetPositions[i*3+2];

                // 1. 基础弹簧力 (Attraction)
                let ax = (tx - px) * SPRING_STRENGTH;
                let ay = (ty - py) * SPRING_STRENGTH;
                let az = (tz - pz) * SPRING_STRENGTH;

                // 2. 交互力 (Wind / Storm)
                if (handPresent) {
                    const dx = px - handPos.x;
                    const dy = py - handPos.y;
                    const dz = pz; // 假设手在 z=0 平面
                    const distSq = dx*dx + dy*dy + dz*dz;

                    // 斥力范围
                    if (distSq < 400) { 
                        const force = (400 - distSq) * 0.002;
                        
                        // 基础斥力 (手占据空间)
                        ax += dx * force * 0.5;
                        ay += dy * force * 0.5;
                        az += dz * force * 0.5;

                        // 挥手风暴 (Directional Force)
                        if (isStorming) {
                            ax += handVelocity.x * force * 5.0;
                            ay += handVelocity.y * force * 5.0;
                            // 加一点 z 轴扰动
                            az += (Math.random()-0.5) * force * 10.0; 
                        }
                    }
                }

                // 3. 积分 (Euler Integration)
                velocities[i*3]   += ax;
                velocities[i*3+1] += ay;
                velocities[i*3+2] += az;

                velocities[i*3]   *= DAMPING;
                velocities[i*3+1] *= DAMPING;
                velocities[i*3+2] *= DAMPING;

                positionsArr[i*3]   += velocities[i*3];
                positionsArr[i*3+1] += velocities[i*3+1];
                positionsArr[i*3+2] += velocities[i*3+2];
            }

            geometry.attributes.position.needsUpdate = true;

            // 深度推拉反馈 (平滑缩放)
            particles.rotation.y += 0.002; // 缓慢自转
            
            // 根据手掌占比缩放整个粒子系统
            const currentScale = particles.scale.x;
            const newScale = THREE.MathUtils.lerp(currentScale, handDepthScale, 0.05);
            particles.scale.set(newScale, newScale, newScale);

            renderer.render(scene, camera);
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动高亮默认状态
        document.getElementById('state-open').classList.add('active');

        animate();
    </script>
</body>
</html>
